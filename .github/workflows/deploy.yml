name: Production CI/CD Deployment

on:
  push:
    branches:
      - prod
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: SSH into EC2 and Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            echo "========================================================"
            echo "🚀 GitHub Actions: Triggering Remote Deployment on EC2"
            echo "========================================================"
            
            # 1. Locate project directory on EC2
            if [ -d "$HOME/AuthGuard" ]; then
              cd "$HOME/AuthGuard"
            elif [ -f "./deploy.sh" ]; then
              true
            else
              FOUND_DIR=$(find "$HOME" -maxdepth 2 -name "deploy.sh" -exec dirname {} \; 2>/dev/null | head -n 1)
              if [ -n "$FOUND_DIR" ]; then
                cd "$FOUND_DIR"
              else
                echo "❌ Error: Could not find project directory with deploy.sh in $HOME!"
                exit 1
              fi
            fi
            
            echo "📍 Deploying in directory: $(pwd)"
            
            # 2. Make scripts executable
            chmod +x deploy.sh init-letsencrypt.sh 2>/dev/null || true
            
            # 3. Execute zero-downtime deployment script
            ./deploy.sh

      - name: Verify Live Application Health
        run: |
          echo "🔍 Verifying live server health..."
          DOMAIN="${{ secrets.EC2_HOST }}.nip.io"
          
          # Retry loop: Check health up to 6 times (30 seconds total)
          MAX_RETRIES=6
          RETRY_COUNT=0
          SUCCESS=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Attempt $RETRY_COUNT of $MAX_RETRIES: Checking https://${DOMAIN}/api/health..."
            
            HTTP_STATUS=$(curl -k -s -L -o /dev/null -w "%{http_code}" "https://${DOMAIN}/api/health" || echo "000")
            echo "Response Status Code: $HTTP_STATUS"
            
            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "✅ HEALTH CHECK PASSED! Backend API is live and returning 200 OK."
              SUCCESS=1
              break
            fi
            
            echo "⏳ Containers still stabilizing, retrying in 5 seconds..."
            sleep 5
          done
          
          if [ $SUCCESS -ne 1 ]; then
            echo "❌ HEALTH CHECK FAILED after $MAX_RETRIES attempts!"
            curl -k -i "https://${DOMAIN}/api/health" || true
            exit 1
          fi