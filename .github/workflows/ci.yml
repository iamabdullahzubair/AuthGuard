name: Continuous Integration (CI)

# 1. Triggers: Run automatically on Pull Requests and Pushes
on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'feature/**'
      - 'fix/**'
      - 'bugfix/**'
      - 'hotfix/**'
      - 'chore/**'
      - 'refactor/**'
      - 'release/**'
  pull_request:
    branches:
      - main
      - prod
      - 'release/**'
  # Allows manual trigger from GitHub Actions UI tab
  workflow_dispatch:

jobs:
  # =========================================================================
  # JOB 1: Frontend Typecheck & Build Validation
  # =========================================================================
  frontend-ci:
    name: 🎨 Frontend (Lint & Build Check)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20 with npm caching
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Frontend dependencies (clean install)
        run: |
          cd frontend
          npm ci

      - name: 🏗️ Verify Frontend Build & TypeScript
        run: |
          cd frontend
          npm run build

  # =========================================================================
  # JOB 2: Backend Automated Tests (with isolated Postgres & Redis)
  # =========================================================================
  backend-ci:
    name: 🛡️ Backend (Unit & Cryptographic Tests)
    runs-on: ubuntu-latest

    # Service containers run in background on GitHub's runner VM
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: authenticator_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout repository code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20 with npm caching
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install Backend dependencies (clean install)
        run: |
          cd backend
          npm ci

      - name: 🧪 Run Automated Tests (Crypto, TOTP & Security)
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/authenticator_db
          REDIS_URL: redis://localhost:6379
          AES_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          SESSION_SECRET: test-ci-session-secret-string-32-chars
          VAPID_PUBLIC_KEY: BNo2PXuFiety_I5a7fQQxpPO8ixhApzyh-DyR5Ut1qGS34wRF4iExHgZHvKy5qRrjMmKd9PH9Algh_5TN6y4Q_0
          VAPID_PRIVATE_KEY: t5LxJrtasXAkHhDKlVwO1TrbVpeZ1OrXEHVSfjK2wMM
        run: |
          cd backend
          npm test
