upstream app_backend {
    server app:3001;
    keepalive 32;
}

# HTTP Server: Redirect to HTTPS & ACME challenge for Certbot
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt ACME challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # SSL Certificates (Loads Let's Encrypt if available, falls back to self-signed)
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # SSL Security Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Maximum upload size
    client_max_body_size 10M;

    # 1. API Endpoints ONLY: Forwarded directly to Node.js Backend (Supports SSE Live Logs Streaming)
    location /api/ {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 86400s;
    }

    # 2. PWA Service Worker (Never cache, allow /pwa/ scope)
    location = /pwa/sw.js {
        root /var/www/dashboard;
        add_header Service-Worker-Allowed "/pwa/" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        expires off;
    }

    # 3. Authenticator PWA Application (Static Assets in frontend/out/pwa)
    location /pwa/ {
        root /var/www/dashboard;
        try_files $uri $uri/ /pwa/index.html =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # 4. Next.js Chunks & Static Bundles Caching
    location /_next/ {
        root /var/www/dashboard;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # 5. Next.js Static Pages (Dashboard, Super Admin, Login, Register, Favicon)
    # If not found, returns 404
    location / {
        root /var/www/dashboard;
        try_files $uri $uri.html $uri/ /404.html =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }
}
